[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrnx-core"
version = "0.1.0"
description = "HRNX: The AI-Native Harness Engineering IDE - Core Engine & Backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HRNX Core Team", email = "engineering@hrnx.dev" }
]
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.3",
    "pygls>=1.3.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ruamel.yaml>=0.18.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
hrnx = "hrnx.cli.main:app"
hrnx-lsp = "hrnx.server.lsp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hrnx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
